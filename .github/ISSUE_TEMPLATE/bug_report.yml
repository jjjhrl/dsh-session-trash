name: Bug report
description: Something in the Session trash plugin did not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste real Session logs, titles, or full
        personal paths — replace them with `example` if needed.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: From `dsh --version`, or 设置 › 通用设置 at the bottom of the page.
      placeholder: 0.2.2-rc.5
    validations:
      required: true
  - type: input
    id: install-method
    attributes:
      label: How the plugin was installed
      placeholder: GitHub URL / local directory / agent
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where it went wrong
      options:
        - Sidebar "Delete session…" action
        - The delete confirmation dialog
        - Settings › Session trash page
        - The session_trash agent tool
        - Plugin installation or update
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the sidebar row menu of an old Session
        2. Choose "Delete session…"
        3. Confirm "Move to trash"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exact message shown, and any Host log lines mentioning `session-trash`.
    validations:
      required: true
  - type: dropdown
    id: session-loaded
    attributes:
      label: Was the Session open in this DSH process?
      description: Sessions the running Host has loaded cannot be deleted by design — see "Safety and limitations".
      options:
        - Not sure
        - "Yes — it was opened in this process"
        - "No — it was an old Session this process never opened"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and Node.js version
      placeholder: macOS 15.2, Node 22.19
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no real Session content or personal paths.
          required: true
